<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#09060d">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; object-src 'none'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'none'; form-action 'none'; upgrade-insecure-requests">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>StyleMe — Sign In Demo</title>
  <link rel="stylesheet" href="./sign-in.css">
  <script src="./sign-in.js" defer></script>
</head>
<body>
  <main class="scene" aria-labelledby="page-title">
    <div class="backdrop" aria-hidden="true">
      <div class="noise"></div>
      <div class="glow glow--top"></div>
      <div class="glow glow--bottom"></div>
      <div class="glow-spot glow-spot--one"></div>
      <div class="glow-spot glow-spot--two"></div>
    </div>

    <a class="back-link" href="https://shahdmohamed2004.github.io/portfolio/" aria-label="Back to Shahd's portfolio">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6M9 12h12"/></svg>
      <span>Back to portfolio</span>
    </a>

    <section class="card-wrap" aria-label="Sign-in demo">
      <article class="card" id="sign-in-card">
        <div class="card-glow" aria-hidden="true"></div>
        <div class="beam beam--top" aria-hidden="true"></div>
        <div class="beam beam--right" aria-hidden="true"></div>
        <div class="beam beam--bottom" aria-hidden="true"></div>
        <div class="beam beam--left" aria-hidden="true"></div>
        <span class="corner corner--tl" aria-hidden="true"></span>
        <span class="corner corner--tr" aria-hidden="true"></span>
        <span class="corner corner--br" aria-hidden="true"></span>
        <span class="corner corner--bl" aria-hidden="true"></span>

        <div class="card-content">
          <header class="card-header">
            <div class="brand-mark" aria-label="Shahd Mohamed">
              <span>S</span>
              <i aria-hidden="true"></i>
            </div>
            <h1 id="page-title">Welcome Back</h1>
            <p>Sign in to continue to StyleMe</p>
          </header>

          <form id="sign-in-form" novalidate>
            <div class="fields">
              <label class="field" for="email">
                <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
                <input id="email" name="email" type="email" autocomplete="username" placeholder="Email address" aria-label="Email address">
              </label>

              <div class="field field--password">
                <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 1 1 8 0v3"/></svg>
                <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password">
                <button class="password-toggle" id="password-toggle" type="button" aria-label="Show password" aria-pressed="false">
                  <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                  <svg class="eye-closed" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.2A11 11 0 0 1 12 5c6.5 0 10 7 10 7a14.6 14.6 0 0 1-3.1 3.8M6.2 6.2C3.5 8 2 12 2 12s3.5 7 10 7a10 10 0 0 0 3.2-.5"/></svg>
                </button>
              </div>
            </div>

            <div class="form-options">
              <label class="remember" for="remember-me">
                <input id="remember-me" name="remember-me" type="checkbox">
                <span class="checkmark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg></span>
                <span>Remember me</span>
              </label>
              <button class="text-action" type="button" data-demo-action="Password recovery">Forgot password?</button>
            </div>

            <button class="submit-button" id="submit-button" type="submit">
              <span class="button-shimmer" aria-hidden="true"></span>
              <span class="button-label">Sign In</span>
              <svg class="button-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>
              <span class="spinner" aria-hidden="true"></span>
            </button>
          </form>

          <div class="divider"><span>or</span></div>

          <button class="google-button" type="button" data-demo-action="Google sign-in">
            <span class="google-g" aria-hidden="true">G</span>
            <span>Sign in with Google</span>
            <span class="google-shimmer" aria-hidden="true"></span>
          </button>

          <p class="signup-copy">Don’t have an account? <button class="text-action signup-link" type="button" data-demo-action="Account creation">Sign up</button></p>

          <p class="demo-note" role="note">Sign-in is not connected yet. Google login needs Firebase setup. No credentials are sent or saved in this preview.</p>
        </div>
      </article>
    </section>

    <div class="toast" id="demo-toast" role="status" aria-live="polite"></div>
    <footer class="page-footer">© 2026 Shahd Mohamed</footer>
  </main>
</body>
</html>
